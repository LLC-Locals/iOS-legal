name: Create follow-up issue

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  create-follow-up:
    # The condition is on the job, not the workflow, so unrelated comments skip
    # it. A skipped job consumes no Actions minutes.
    if: >-
      ${{
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '<!-- follow-up-request -->') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      }}
    # The implementation is shared by all Locals repositories and lives in
    # locals-discovery. Do not copy it back here: the two bugs this replaced —
    # a checkout with no contents:read, and a concurrency group that silently
    # dropped queued requests — were both in the shared half.
    uses: LLC-Locals/locals-discovery/.github/workflows/follow-up-request.yml@main
    secrets:
      TASK_AUTOMATION_TOKEN: ${{ secrets.TASK_AUTOMATION_TOKEN }}
